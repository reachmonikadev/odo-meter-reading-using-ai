name: odometer_scanner
description: >-
  Flutter module that captures an odometer photo, checks image
  quality and extracts a validated odometer reading using Google Gemini.
version: 0.1.1
repository: https://github.com/reachmonikadev/odo-meter-reading-using-ai/tree/main/packages/odometer_scanner
issue_tracker: https://github.com/reachmonikadev/odo-meter-reading-using-ai/issues
topics:
  - odometer
  - ocr
  - gemini
  - camera
  - vehicle

platforms:
  android:
  ios:

screenshots:
  - description: Mechanical odometer verified with the reading and AI confidence.
    path: screenshots/verified_mechanical.jpg
  - description: Digital odometer verified with the reading in kilometres.
    path: screenshots/verified_digital.jpg
  - description: Another mechanical odometer verified in miles.
    path: screenshots/verified_mechanical_2.jpg
  - description: Photo of a screen rejected with a how-to-fix hint.
    path: screenshots/rejected_screen_photo.jpg
  - description: Edited or watermarked image rejected.
    path: screenshots/rejected_stock_image.jpg

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  equatable: ">=2.0.7 <4.0.0"
  flutter_bloc: ^9.1.1
  http: ^1.4.0
  image: ^4.5.4
  image_picker: ^1.1.2

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
